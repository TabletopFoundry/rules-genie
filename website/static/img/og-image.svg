<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0a17"/>
      <stop offset="100%" stop-color="#14122a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0%" stop-color="rgba(124,58,237,0.45)"/>
      <stop offset="100%" stop-color="rgba(124,58,237,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(90,180)">
    <rect width="120" height="120" rx="28" fill="url(#accent)"/>
    <g fill="#ffffff" transform="translate(20,30)">
      <rect width="80" height="10" rx="3"/>
      <rect y="22" width="80" height="10" rx="3"/>
      <rect y="44" width="50" height="10" rx="3"/>
    </g>
  </g>
  <text x="240" y="260" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="84" font-weight="800" fill="#ffffff">RulesGenie</text>
  <text x="240" y="330" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="500" fill="#c4b5fd">Stop flipping through rulebooks.</text>
  <text x="240" y="380" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="500" fill="url(#accent)">Get the ruling in seconds.</text>
  <g transform="translate(240,440)" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#ede9fe">
    <rect width="640" height="60" rx="14" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.12)"/>
    <text x="22" y="38" font-family="SFMono-Regular, Menlo, monospace">$ npx create-rulesgenie my-rules</text>
  </g>
</svg>
